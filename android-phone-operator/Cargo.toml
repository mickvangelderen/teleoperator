[package]
name = "android-phone-operator"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "phone_operator"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phone-operator-synthetic"
path = "src/main.rs"

[[bin]]
name = "phone-operator-spatial-synthetic"
path = "src/spatial_synthetic.rs"

[[bin]]
name = "phone-operator-displacement-synthetic"
path = "src/displacement_synthetic.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
libc = "0.2"
log = "0.4"
rtc = "0.21.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tower-http = { version = "0.7", features = ["timeout"] }
webrtc = "0.21.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
android_logger = { version = "0.15.1", default-features = false }

[patch.crates-io]
# rtc 0.21.1 loses remote DCEP reliability settings; pinned upstream fix.
# https://github.com/webrtc-rs/rtc/pull/280
rtc = { git = "https://github.com/webrtc-rs/rtc", rev = "70901c3df6ad92dcb87d97af3d1e2fa8a2e2ae38" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
strip = "debuginfo"
