[package]
name = "xr-operator"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "xr_operator"
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tower-http = { version = "0.6", features = ["timeout"] }
webrtc = "=0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = { version = "0.15.1", default-features = false }
openxr = "0.22.0"
jni = "0.21.1"

[[bin]]
name = "xr-operator-server"
path = "src/main.rs"

[package.metadata.android]
package = "dev.xroperator.quest"
apk_name = "xr-operator"
build_targets = ["aarch64-linux-android"]
runtime_libs = "libs"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.BODY_TRACKING"

[[package.metadata.android.uses_feature]]
name = "com.oculus.software.body_tracking"
required = false

[package.metadata.android.sdk]
min_sdk_version = 32
target_sdk_version = 32

[package.metadata.android.application]
label = "XR Operator"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
name = "android.app.NativeActivity"
exported = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "org.khronos.openxr.intent.category.IMMERSIVE_HMD"]

[[package.metadata.android.application.activity.meta_data]]
name = "com.oculus.vr.focusaware"
value = "true"

[[package.metadata.android.queries.provider]]
name = "org.khronos.openxr.runtime_broker"
authorities = "org.khronos.openxr.runtime_broker;org.khronos.openxr.system_runtime_broker"

[[package.metadata.android.uses_feature]]
name = "com.oculus.feature.PASSTHROUGH"
required = true

[[package.metadata.android.application.meta_data]]
name = "com.oculus.supportedDevices"
value = "all"
