[package]
name = "xr-operator"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "xr_operator"
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = "0.8"
bytes = "1"
flatbuffers = "=25.9.23"
getrandom = "0.3"
log = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tower-http = { version = "0.6", features = ["timeout"] }
webrtc = "=0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = { version = "0.15.1", default-features = false }

[[bin]]
name = "xr-operator-server"
path = "src/main.rs"

[package.metadata.android]
package = "dev.xroperator.quest"
apk_name = "xr-operator"
build_targets = ["aarch64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 32
target_sdk_version = 32

[package.metadata.android.application]
label = "XR Operator"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
name = "android.app.NativeActivity"
exported = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout"
