[package]
name = "gamepad-operator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
desktop-discovery = { path = "../desktop-discovery" }
log = "0.4"
env_logger = "0.11"
rtc = "0.21.1"
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tower-http = { version = "0.7", features = ["timeout"] }
webrtc = "0.21.1"

[patch.crates-io]
# Preserve remote DCEP channel reliability: https://github.com/webrtc-rs/rtc/pull/280
rtc = { git = "https://github.com/webrtc-rs/rtc", rev = "70901c3df6ad92dcb87d97af3d1e2fa8a2e2ae38" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
strip = "debuginfo"
